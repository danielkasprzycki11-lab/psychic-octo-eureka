{% extends "library/base.html" %}

{% block title %}Logowanie – BiblioTech{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h1 class="h3 mb-3 text-center">Logowanie do BiblioTech</h1>

    {% if form.errors %}
      <div class="alert alert-danger">
        Nieprawidłowy login lub hasło.
      </div>
    {% endif %}

    <form method="post" class="card card-body">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Login</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Hasło</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Zaloguj</button>
    </form>

    <p class="mt-3 text-center">
      <a href="{% url 'library:book_list' %}">Powrót do katalogu</a>
    </p>
  </div>
</div>
{% endblock %}
